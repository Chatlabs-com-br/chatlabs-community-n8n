name: Publish to npm

# Publishes when package.json on main has a version not yet on npm.
# Bump the version in the PR (npm version patch|minor --no-git-tag-version).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm, skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION not on npm, will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    # Only publish from main, even on manual runs
    if: github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - run: npm publish --provenance --access public

      - name: Tag release
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
